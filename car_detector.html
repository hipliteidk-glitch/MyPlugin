<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Detector - Safe to Go?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            text-align: center;
        }
        #video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #status-badge {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
        }
        #result-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255,255,255,0.15);
            transition: all 0.3s ease;
        }
        #result-box.safe {
            border-color: #4caf50;
            color: #4caf50;
            box-shadow: 0 0 40px rgba(76,175,80,0.2);
        }
        #result-box.unsafe {
            border-color: #f44336;
            color: #f44336;
            box-shadow: 0 0 40px rgba(244,67,54,0.2);
        }
        #result-box.waiting {
            border-color: #ffa726;
            color: #ffa726;
        }
        #confidence {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.7;
            margin-top: 4px;
        }
        #controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #2a2a2a;
            color: #fff;
            flex: 1;
            min-width: 100px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        button:active {
            transform: scale(0.95);
        }
        #btn-start {
            background: #4caf50;
            color: #fff;
            border-color: #4caf50;
        }
        #btn-start:active {
            background: #388e3c;
        }
        #btn-stop {
            background: #f44336;
            color: #fff;
            border-color: #f44336;
        }
        #btn-stop:active {
            background: #c62828;
        }
        #status-text {
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.5;
            color: #aaa;
        }
        @media (max-width: 480px) {
            #result-box {
                font-size: 20px;
                padding: 12px 16px;
            }
            #result-box .sub {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="video-wrapper">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <div id="overlay">
                <div id="status-badge">📷 CAMERA</div>
                <div id="result-box" class="waiting">
                    <span id="result-text">⬇️ Point camera at road</span>
                    <div id="confidence">Waiting for view...</div>
                </div>
            </div>
        </div>
        <div id="controls">
            <button id="btn-start">▶ Start</button>
            <button id="btn-stop">⏹ Stop</button>
        </div>
        <div id="status-text">Uses a lightweight color/shape heuristic — no server uploads</div>
    </div>
    <script>
        (function() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const resultText = document.getElementById('result-text');
            const confidenceEl = document.getElementById('confidence');
            const resultBox = document.getElementById('result-box');
            const statusBadge = document.getElementById('status-badge');

            let stream = null;
            let animationId = null;
            let running = false;
            let lastResult = 'waiting';
            let lastConfidence = 0;

            // ----- Heuristic: detect "car-like" regions -----
            function detectCar(imageData) {
                const data = imageData.data;
                const w = imageData.width;
                const h = imageData.height;
                const totalPixels = w * h;

                // Sample a grid to keep it fast on mobile
                const step = 8;
                let darkPixels = 0;
                let brightPixels = 0;
                let redPixels = 0;
                let bluePixels = 0;
                let edgePixels = 0;

                // We'll look at bottom half more (where cars usually are)
                const startY = Math.floor(h * 0.4);
                const endY = h;

                for (let y = startY; y < endY; y += step) {
                    for (let x = 0; x < w; x += step) {
                        const idx = (y * w + x) * 4;
                        const r = data[idx];
                        const g = data[idx + 1];
                        const b = data[idx + 2];
                        const brightness = (r + g + b) / 3;

                        // Dark pixels (undercarriage, tires, shadows)
                        if (brightness < 80) darkPixels++;
                        // Bright / reflective (windshields, headlights)
                        if (brightness > 200) brightPixels++;
                        // Red-ish (taillights, brake lights)
                        if (r > 150 && g < 100 && b < 100) redPixels++;
                        // Blue-ish (headlights in some cars, reflections)
                        if (b > 150 && r < 100 && g < 100) bluePixels++;
                        // Edge-like (sharp contrast) - simple gradient check
                        if (x + step < w && y + step < h) {
                            const idx2 = ((y + step) * w + (x + step)) * 4;
                            const r2 = data[idx2];
                            const g2 = data[idx2 + 1];
                            const b2 = data[idx2 + 2];
                            const b2val = (r2 + g2 + b2) / 3;
                            if (Math.abs(brightness - b2val) > 60) edgePixels++;
                        }
                    }
                }

                const sampled = (endY - startY) / step * (w / step);
                const darkRatio = darkPixels / sampled;
                const brightRatio = brightPixels / sampled;
                const redRatio = redPixels / sampled;
                const blueRatio = bluePixels / sampled;
                const edgeRatio = edgePixels / sampled;

                // Weighted score: cars tend to have dark lower body, some bright reflections, red/blue lights
                let score = 0;
                // Dark underbody is strong indicator
                if (darkRatio > 0.08) score += 25;
                if (darkRatio > 0.15) score += 20;
                if (darkRatio > 0.25) score += 15;
                // Bright reflections from windshield/headlights
                if (brightRatio > 0.05) score += 10;
                if (brightRatio > 0.12) score += 15;
                // Red taillights
                if (redRatio > 0.02) score += 20;
                if (redRatio > 0.06) score += 15;
                // Blue headlight reflections
                if (blueRatio > 0.02) score += 10;
                // Edges (car outlines)
                if (edgeRatio > 0.05) score += 10;
                if (edgeRatio > 0.12) score += 10;

                // Normalize to 0-100
                let confidence = Math.min(100, Math.round(score * 0.85));
                // Boost if we have both dark and bright (high contrast)
                if (darkRatio > 0.1 && brightRatio > 0.05) confidence += 10;
                // Penalize if mostly uniform (sky/wall)
                if (darkRatio < 0.02 && brightRatio < 0.02 && redRatio < 0.01 && blueRatio < 0.01) {
                    confidence = Math.max(0, confidence - 30);
                }

                // Also check if bottom half has significant dark (car body)
                const bottomDark = darkPixels / sampled;
                if (bottomDark > 0.2) confidence += 10;

                confidence = Math.min(100, Math.max(0, confidence));

                // Determine result
                let result = 'waiting';
                if (confidence > 58) {
                    result = 'unsafe';
                } else if (confidence > 35) {
                    result = 'waiting';
                } else {
                    result = 'safe';
                }

                return { result, confidence, darkRatio, brightRatio, redRatio, edgeRatio };
            }

            function processFrame() {
                if (!running) return;

                const w = video.videoWidth;
                const h = video.videoHeight;
                if (w === 0 || h === 0) {
                    animationId = requestAnimationFrame(processFrame);
                    return;
                }

                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(video, 0, 0, w, h);
                const imageData = ctx.getImageData(0, 0, w, h);

                const { result, confidence, darkRatio, brightRatio, redRatio } = detectCar(imageData);

                lastResult = result;
                lastConfidence = confidence;

                // Update UI
                updateUI(result, confidence, darkRatio, brightRatio, redRatio);

                animationId = requestAnimationFrame(processFrame);
            }

            function updateUI(result, confidence, darkRatio, brightRatio, redRatio) {
                // Main text
                if (result === 'safe') {
                    resultText.textContent = '✅ SAFE — GO!';
                    resultBox.className = 'safe';
                    statusBadge.textContent = '🟢 CLEAR';
                } else if (result === 'unsafe') {
                    resultText.textContent = '🚫 CAR — WAIT!';
                    resultBox.className = 'unsafe';
                    statusBadge.textContent = '🔴 CAR DETECTED';
                } else {
                    resultText.textContent = '⏳ CHECKING...';
                    resultBox.className = 'waiting';
                    statusBadge.textContent = '🟡 ANALYZING';
                }

                // Confidence + details
                let detail = `Confidence: ${confidence}%`;
                if (darkRatio !== undefined) {
                    detail += ` | Dark: ${(darkRatio*100).toFixed(0)}%`;
                }
                if (brightRatio !== undefined) {
                    detail += ` | Bright: ${(brightRatio*100).toFixed(0)}%`;
                }
                if (redRatio !== undefined) {
                    detail += ` | Red: ${(redRatio*100).toFixed(0)}%`;
                }
                confidenceEl.textContent = detail;
            }

            // ----- Camera -----
            async function startCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    running = true;
                    document.getElementById('status-text').textContent = '📡 Live — pointing at road?';
                    processFrame();
                } catch (err) {
                    console.error(err);
                    document.getElementById('status-text').textContent = '❌ Camera error: ' + err.message;
                    running = false;
                }
            }

            function stopCamera() {
                running = false;
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }
                video.srcObject = null;
                document.getElementById('status-text').textContent = '⏹ Stopped';
                resultText.textContent = '⏸ Camera off';
                resultBox.className = 'waiting';
                statusBadge.textContent = '📷 OFF';
                confidenceEl.textContent = 'Tap Start to begin';
            }

            // ----- Buttons -----
            document.getElementById('btn-start').addEventListener('click', () => {
                if (running) {
                    stopCamera();
                }
                startCamera();
            });

            document.getElementById('btn-stop').addEventListener('click', stopCamera);

            // Handle page visibility (pause when hidden to save battery)
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && running) {
                    // pause detection but keep camera? better to stop to save resources
                    // we'll just let it continue but it'll be fine
                }
            });

            // Initial state
            resultText.textContent = '⬇️ Point camera at road';
            confidenceEl.textContent = 'Tap Start to begin';
            statusBadge.textContent = '📷 READY';
        })();
    </script>
</body>
</html>
