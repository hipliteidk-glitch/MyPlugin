name: Generate Gradle Wrapper
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Create root build files if missing
      run: |
        [ -f settings.gradle.kts ] || printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n        maven("https://maven.aliucord.com/snapshots")\n    }\n}\nrootProject.name = "MyPlugin"\ninclude(":app")\n' > settings.gradle.kts
        [ -f build.gradle.kts ] || printf 'plugins {\n    id("com.android.application") version "8.2.0" apply false\n    id("org.jetbrains.kotlin.android") version "1.9.22" apply false\n}\n' > build.gradle.kts
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7
    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add gradlew gradlew.bat gradle/wrapper/ settings.gradle.kts build.gradle.kts
        git diff --cached --quiet || git commit -m "chore: add Gradle wrapper and root build files"
        git push
