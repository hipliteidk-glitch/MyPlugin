name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/tools/bin" >> $GITHUB_PATH

    - name: Checkout Aliucord
      run: |
        git clone --depth 1 https://github.com/Aliucord/Aliucord.git ../Aliucord
        cd ../Aliucord
        git checkout main

    - name: Build Aliucord SDK
      run: |
        cd ../Aliucord
        chmod +x gradlew
        ./gradlew :Aliucord:assemble -x test --no-daemon

    - name: Build Plugin
      run: |
        cd android-project
        chmod +x gradlew
        ./gradlew assembleDebug createPluginZip --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: plugin-apk
        path: android-project/app/build/outputs/apk/*

    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: plugin-zip
        path: android-project/app/build/outputs/zip/*
